<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jaal: design</title>
<style>
/* The sheet around the window uses the host's theme when there is one. */
body { margin: 0; font: 13px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); color: var(--foreground, #1c1c1c); }
.wrap { max-width: 1000px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 2px 0 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--border, #d9d9d9); border-radius: 8px; }
.seg button { font: inherit; font-size: 12.5px; padding: 3px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground, #6b6b6b); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--secondary, #ececec); color: var(--foreground, #1c1c1c); font-weight: 600; }
/* Room for three lines, so the window does not jump when the caption changes. */
.cap { margin: 4px 0 10px; min-height: 4.35em; color: var(--muted-foreground, #6b6b6b); }
.fit { position: relative; width: 100%; margin: 0 0 26px; }

/* ---------- Tokens ----------
   A space sets two hues: --h tints the chrome, --ha colors the accent.
   Every other color is derived from them, once for light and once for dark. */
.win {
  --h: 75; --ha: 42;
  --chrome-top: oklch(0.932 0.014 var(--h)); --chrome-bottom: oklch(0.9 0.02 var(--h));
  --ink: oklch(0.27 0.012 var(--h)); --ink-2: oklch(0.52 0.018 var(--h)); --ink-3: oklch(0.69 0.022 var(--h));
  --fill: oklch(0.35 0.04 var(--h) / .085); --fill-hover: oklch(0.35 0.04 var(--h) / .05); --line: oklch(0.35 0.04 var(--h) / .14); --line-strong: oklch(0.35 0.04 var(--h) / .3);
  --accent: oklch(0.58 0.15 var(--ha)); --accent-ink: oklch(0.47 0.14 var(--ha)); --accent-fill: oklch(0.58 0.15 var(--ha) / .14); --on-accent: #fff;
  --danger: oklch(0.55 0.19 27);
  --raised: #fff; --raised-shadow: 0 0 0 .5px oklch(0.3 0.04 var(--h) / .12), 0 1px 2.5px oklch(0.3 0.04 var(--h) / .16);
  --card-shadow: 0 0 0 .5px oklch(0.3 0.04 var(--h) / .16), 0 2px 10px oklch(0.3 0.04 var(--h) / .12);
  --glass: oklch(0.975 0.006 var(--h) / .74); --glass-shadow: 0 0 0 .5px oklch(0.25 0.03 var(--h) / .24), 0 2px 6px oklch(0.25 0.03 var(--h) / .08), 0 28px 64px oklch(0.25 0.03 var(--h) / .32);
  --pop-shadow: 0 0 0 .5px oklch(0.25 0.03 var(--h) / .24), 0 2px 6px oklch(0.25 0.03 var(--h) / .08), 0 14px 34px oklch(0.25 0.03 var(--h) / .24);
  --win-shadow: 0 0 0 1px oklch(0.3 0.03 var(--h) / .2), 0 10px 26px oklch(0.25 0.03 var(--h) / .18);
  --mark: oklch(0.91 0.13 98);
  --pg-bg: #fff; --pg-fg: #1d1d1f; --pg-mut: #6e6e73; --pg-sunk: #f5f5f3; --pg-line: #ececea; --pg-shape: #e4e4e0;
}
.win[data-theme="dark"] {
  --chrome-top: oklch(0.255 0.016 var(--h)); --chrome-bottom: oklch(0.215 0.018 var(--h));
  --ink: oklch(0.94 0.006 var(--h)); --ink-2: oklch(0.74 0.012 var(--h)); --ink-3: oklch(0.55 0.014 var(--h));
  --fill: oklch(1 0 0 / .075); --fill-hover: oklch(1 0 0 / .045); --line: oklch(1 0 0 / .1); --line-strong: oklch(1 0 0 / .24);
  --accent: oklch(0.76 0.13 var(--ha)); --accent-ink: oklch(0.83 0.11 var(--ha)); --accent-fill: oklch(0.76 0.13 var(--ha) / .2); --on-accent: oklch(0.2 0.04 var(--ha));
  --danger: oklch(0.74 0.15 27);
  --raised: oklch(1 0 0 / .15); --raised-shadow: 0 0 0 .5px oklch(1 0 0 / .07), 0 1px 2px oklch(0 0 0 / .3);
  --card-shadow: 0 0 0 .5px oklch(1 0 0 / .1), 0 2px 10px oklch(0 0 0 / .35);
  --glass: oklch(0.27 0.014 var(--h) / .72); --glass-shadow: 0 0 0 .5px oklch(1 0 0 / .18), 0 28px 64px oklch(0 0 0 / .55);
  --pop-shadow: 0 0 0 .5px oklch(1 0 0 / .18), 0 14px 34px oklch(0 0 0 / .5);
  --win-shadow: 0 0 0 1px oklch(0 0 0 / .6), 0 10px 26px oklch(0 0 0 / .3);
  --mark: oklch(0.52 0.1 98);
  --pg-bg: #1b1b1d; --pg-fg: #f2f2f4; --pg-mut: #a0a0a6; --pg-sunk: #262628; --pg-line: #2e2e31; --pg-shape: #3b3b3f;
}

/* ---------- Window ---------- */
.win { position: absolute; left: 0; top: 0; width: 1000px; height: 640px; transform-origin: 0 0; border-radius: 12px; overflow: hidden; font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; cursor: default; user-select: none; background: linear-gradient(180deg, var(--chrome-top), var(--chrome-bottom)); color: var(--ink); box-shadow: var(--win-shadow); }
.win[data-os="win"] { border-radius: 8px; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
.win button, .win input { font: inherit; color: inherit; }
.win :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.fv { width: 16px; height: 16px; flex: none; border-radius: 4px; display: grid; place-items: center; font: 700 9px/1 system-ui, sans-serif; font-variant-emoji: text; letter-spacing: -0.02em; }
.win[data-theme="dark"] .fv { box-shadow: 0 0 0 1px oklch(1 0 0 / .14); }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.grow { flex: 1; }
.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { display: block; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
kbd { font: inherit; }

/* Sidebar */
.side { position: absolute; z-index: 2; inset: 0 auto 0 0; width: 236px; padding: 0 10px; box-sizing: border-box; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 4px; color: var(--ink-2); }
.top .dim { display: flex; color: var(--ink-3); }
/* On Windows the window buttons live in the sidebar's top row, as in Zen. No strip above the page. */
.capbtns { display: flex; margin-right: -8px; }
.capbtns span { width: 27px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--ink); }
.capbtns span:hover { background: var(--fill); }
.capbtns svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
.url { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 9px; border-radius: 9px; background: var(--fill); font-size: 12.5px; color: var(--ink-2); }
.url b { font-weight: 500; color: var(--ink); }
.url .ph { color: var(--ink-3); }
.url.focus { background: var(--raised); box-shadow: 0 0 0 2px var(--accent); color: var(--ink); }
.url .sel { background: var(--accent-fill); border-radius: 2px; }
.url.loading { overflow: hidden; }
.url .load { position: absolute; left: 0; bottom: 0; width: 55%; height: 2px; background: var(--accent); }
.favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 14px; }
.tile { height: 38px; border-radius: 10px; background: var(--fill); display: grid; place-items: center; transition: background .1s; }
.tile:hover { background: var(--line); }
.label { display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.label .ic { width: 14px; height: 14px; color: var(--accent); }
.row { position: relative; display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 9px; border-radius: 8px; transition: background .08s; }
.row:hover, .row.hover { background: var(--fill-hover); }
.row .ic { color: var(--ink-3); }
.row .close { display: none; }
.row:hover .close, .row.hover .close, .row.on .close { display: block; }
.row.on { background: var(--raised); box-shadow: var(--raised-shadow); }
.row.new { color: var(--ink-2); }
.row small { font-size: 11px; color: var(--ink-3); }
.row.asleep { color: var(--ink-2); }
.row.asleep .fv { opacity: .45; }
.row.child { margin-left: 16px; }
.row.drag { background: var(--raised); box-shadow: 0 8px 20px oklch(0.2 0.03 var(--h) / .25), var(--raised-shadow); transform: translateX(10px) rotate(-1.5deg); }
.drop { height: 2px; margin: 2px 6px; border-radius: 1px; background: var(--accent); }
.hint { height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px dashed var(--line-strong); font-size: 12px; color: var(--ink-3); box-sizing: border-box; }
/* A split is one raised group with a line for each pane, so both titles stay readable. */
.row.split { height: auto; flex-direction: column; align-items: stretch; gap: 2px; padding: 3px; }
.row.split .half { display: flex; align-items: center; gap: 9px; height: 26px; padding: 0 6px; border-radius: 6px; color: var(--ink-2); }
.row.split .half.focus { color: var(--ink); background: var(--accent-fill); }
.divider { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 9px; font-size: 11px; color: var(--ink-3); }
.divider hr { flex: 1; border: 0; border-top: 1px solid var(--line); }
.foot { display: flex; align-items: center; height: 42px; padding: 0 6px; color: var(--ink-2); }
.anchor { position: relative; display: flex; }
.spaces { display: flex; align-items: center; gap: 2px; }
.sp { width: 28px; height: 24px; display: grid; place-items: center; border-radius: 7px; color: var(--ink-3); cursor: pointer; transition: background .1s, color .1s; }
.sp:hover { background: var(--fill-hover); color: var(--ink-2); }
.sp.on { background: var(--accent-fill); color: var(--accent-ink); }
.spin { width: 14px; height: 14px; margin: 1px; flex: none; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* Pages */
.panes { position: absolute; inset: 8px 8px 8px 236px; display: flex; gap: 8px; }
.win[data-view="hidden"] .panes { left: 8px; }
.win[data-view="split"] .panes::after { content: ""; position: absolute; left: calc(50% - 2px); top: calc(50% - 18px); width: 4px; height: 36px; border-radius: 2px; background: var(--ink-3); opacity: .7; }
.page { position: relative; flex: 1; min-width: 0; border-radius: 10px; box-shadow: var(--card-shadow); overflow: hidden; container-type: inline-size; background: var(--pg-bg); color: var(--pg-fg); font: 14.5px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
.win[data-view="split"] .page.focus { box-shadow: 0 0 0 1.5px var(--accent), var(--card-shadow); }
.empty { flex: 1; display: grid; place-content: center; justify-items: center; gap: 4px; border-radius: 10px; border: 1.5px dashed var(--line-strong); color: var(--ink-2); }
.empty b { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
.badge { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-fill); color: var(--accent-ink); }

/* The site inside the page. It follows the theme, as most sites do. */
.pg { max-width: 580px; margin: 0 auto; padding: 0 40px; }
.pg-nav { display: flex; align-items: center; gap: 22px; height: 52px; font-size: 12.5px; color: var(--pg-mut); border-bottom: 1px solid var(--pg-line); margin-bottom: 38px; white-space: nowrap; }
.pg-nav b { color: var(--pg-fg); font-size: 14px; letter-spacing: -0.01em; }
.pg-kick { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--pg-mut); }
.pg h1 { font: 600 36px/1.08 ui-serif, "New York", Georgia, serif; letter-spacing: -0.02em; margin: 10px 0 12px; text-wrap: balance; }
.pg-lede { font-size: 17px; line-height: 1.45; color: var(--pg-mut); margin: 0 0 26px; }
.pg-fig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 26px; }
.pg-fig div { background: var(--pg-sunk); border-radius: 10px; padding: 14px 14px 12px; font-size: 12px; color: var(--pg-mut); }
.pg-fig svg { display: block; width: 100%; height: 74px; margin-bottom: 10px; }
.f-win { fill: var(--pg-bg); stroke: var(--pg-shape); } .f-page { fill: var(--pg-shape); } .f-bar { fill: var(--pg-fg); } .f-dash { fill: none; stroke: var(--pg-fg); stroke-dasharray: 3 3; }
.pg p { margin: 0 0 14px; }
.pg pre { margin: 0 0 14px; padding: 12px 14px; border-radius: 8px; background: var(--pg-sunk); font: 12px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow: hidden; }
.pg mark { background: var(--mark); color: inherit; border-radius: 2px; }
.pg mark.cur { background: var(--accent); color: var(--on-accent); }
@container (max-width: 480px) {
  .pg { padding: 0 24px; }
  .pg-nav { gap: 14px; margin-bottom: 26px; }
  .pg h1 { font-size: 28px; }
  .pg-lede { font-size: 15px; margin-bottom: 20px; }
  .pg-fig { grid-template-columns: 1fr; gap: 8px; }
  .pg-fig div { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .pg-fig svg { width: 92px; height: 46px; margin: 0; flex: none; }
}

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: var(--fill); font-size: 12.5px; font-weight: 550; white-space: nowrap; cursor: pointer; transition: background .12s, filter .12s, transform .08s; }
.btn:hover { background: var(--line); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--fill); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; pointer-events: none; }
.ibtn { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); cursor: pointer; transition: background .12s, transform .08s; }
.ibtn:hover { background: var(--fill); }
.ibtn:active { transform: scale(.94); }
.ibtn.on { background: var(--accent-fill); color: var(--accent-ink); }
.field { width: 100%; height: 30px; box-sizing: border-box; padding: 0 9px; border: 0; border-radius: 8px; background: var(--fill); font-size: 13px; outline: 0; transition: box-shadow .12s, background .12s; }
.field::placeholder { color: var(--ink-3); }
.field:focus, .field.focus { background: var(--raised); box-shadow: 0 0 0 2px var(--accent); outline: 0; }
.toggle { position: relative; width: 30px; height: 18px; flex: none; padding: 0; border: 0; border-radius: 9px; background: var(--line-strong); cursor: pointer; transition: background .15s; }
.toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px oklch(0 0 0 / .25); transition: transform .16s cubic-bezier(.3, .7, .3, 1); }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(12px); }
.check, .radio { width: 16px; height: 16px; flex: none; box-sizing: border-box; display: grid; place-items: center; border-radius: 4.5px; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.radio { border-radius: 50%; }
.check.on, .radio.on { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.check .ic { width: 12px; height: 12px; stroke-width: 2; }
.radio.on::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--on-accent); }
.choice { display: inline-flex; align-items: center; gap: 7px; }
.segc { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--fill); }
.segc button { height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-size: 12.5px; cursor: pointer; transition: color .1s; }
.segc button:hover { color: var(--ink); }
.segc button[aria-pressed="true"] { background: var(--raised); box-shadow: var(--raised-shadow); color: var(--ink); font-weight: 550; }
.select { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 5px 0 10px; border-radius: 7px; background: var(--fill); font-size: 12.5px; white-space: nowrap; cursor: pointer; transition: background .12s; }
.select:hover { background: var(--line); }
.select .ic { color: var(--ink-2); }
.win input[type="range"] { width: 150px; accent-color: var(--accent); }
.key { display: inline-grid; place-items: center; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 5px; background: var(--fill); font-size: 11.5px; color: var(--ink-2); }
.bar { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.tip { display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--ink); color: var(--chrome-top); font-size: 12px; }
.tip kbd { opacity: .65; }
.toast { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 13px; border-radius: 17px; background: var(--glass); box-shadow: var(--pop-shadow); font-size: 12.5px; }
.toast .ic { color: var(--accent-ink); }
.toast b { font-weight: 600; color: var(--accent-ink); margin-left: 6px; }
.glabel { margin: 12px 0 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.sep { height: 1px; margin: 5px 9px; background: var(--line); }

/* Popovers and menus: the same glass as the command bar, one size down. */
.pop { position: absolute; z-index: 6; box-sizing: border-box; padding: 12px; border-radius: 14px; background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(1.7); backdrop-filter: blur(28px) saturate(1.7); box-shadow: var(--pop-shadow); font-size: 13px; font-weight: 400; color: var(--ink); white-space: normal; }
.pop.static { position: relative; }
.pop-head { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
.pop-title { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
.pop-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.prow { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.menu { min-width: 220px; padding: 5px; border-radius: 11px; }
.mi { display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 9px; border-radius: 7px; white-space: nowrap; }
.mi .ic { color: var(--ink-2); }
.mi small { margin-left: auto; padding-left: 18px; font-size: 12px; color: var(--ink-3); }
.mi:hover, .mi.hot { background: var(--accent-fill); }
.pop.tabmenu { left: 124px; top: 24px; }
.pop.site, .pop.prompt { left: 0; top: 38px; width: 300px; }
.pop.downloads { left: -6px; bottom: 30px; width: 308px; }
.pop.newspace { left: -64px; bottom: 30px; width: 272px; }
.dl { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.dl .ic { color: var(--ink-2); }
.dl .bar { margin: 5px 0 3px; }
.find { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 6px; height: 38px; width: 300px; box-sizing: border-box; padding: 0 6px 0 11px; border-radius: 12px; background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(1.7); backdrop-filter: blur(28px) saturate(1.7); box-shadow: var(--pop-shadow); font: 13px/1.3 system-ui, sans-serif; color: var(--ink); }
.find > .ic { color: var(--ink-3); }
.find small { font-size: 12px; color: var(--ink-3); white-space: nowrap; padding-right: 4px; }
.icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.icons .ibtn { width: auto; height: 30px; }
.hues { display: flex; gap: 10px; padding: 3px 3px 0; }
.hue { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: var(--sw); cursor: pointer; transition: transform .1s; }
.hue:hover { transform: scale(1.12); }
.hue.on { outline: 2px solid var(--sw); outline-offset: 2px; }

/* Command bar */
.cmd { position: absolute; z-index: 5; left: calc(236px + (100% - 244px - 540px) / 2); top: 104px; width: 540px; box-sizing: border-box; border-radius: 16px; padding: 0 8px 8px; background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(1.7); backdrop-filter: blur(28px) saturate(1.7); box-shadow: var(--glass-shadow); }
.win[data-os="win"] .cmd { border-radius: 12px; }
.cmd-in { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 10px; font-size: 17px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.cmd-in .ic { color: var(--ink-3); width: 18px; height: 18px; }
.cmd-in .ghost { color: var(--ink-3); }
.caret { display: inline-block; width: 1.5px; height: 1.15em; vertical-align: -0.18em; margin: 0 0.5px; background: var(--accent); }
.res { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 10px; border-radius: 10px; }
.res:hover { background: var(--fill-hover); }
.res .ic { color: var(--ink-2); }
.res small { font-size: 12px; color: var(--ink-3); }
.res em { font-style: normal; font-size: 12px; color: var(--ink-3); }
.res.on { background: var(--accent-fill); }
.res.on em { color: var(--accent-ink); font-weight: 550; }
.cmd-foot { display: flex; gap: 16px; padding: 10px 10px 2px; margin-top: 6px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-2); }
.cmd-foot kbd { color: var(--ink); margin-right: 4px; }

/* ---------- jaal's own pages (settings and the like) ---------- */
.page.app { color: var(--ink); font-size: 13px; line-height: 1.4; }
.settings { display: flex; }
.set-nav { width: 180px; flex: none; box-sizing: border-box; padding: 20px 10px; border-right: 1px solid var(--line); }
.set-title { padding: 0 9px 12px; font-size: 15px; font-weight: 650; }
.set-nav .row.on { background: var(--fill); box-shadow: none; }
.set-nav .row.on .ic { color: var(--accent-ink); }
.set-body { flex: 1; min-width: 0; padding: 22px 36px; }
.set-body h2 { margin: 0 0 3px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.set-sub { margin: 0 0 16px; color: var(--ink-2); max-width: 46ch; }
.srow { display: flex; align-items: center; gap: 20px; min-height: 54px; box-sizing: border-box; padding: 8px 0; border-top: 1px solid var(--line); }
.srow .txt { flex: 1; min-width: 0; }
.srow .txt span { display: block; margin-top: 1px; font-size: 12px; color: var(--ink-2); }
.splist { display: grid; gap: 4px; margin-bottom: 6px; }
.splist .row { height: 44px; gap: 11px; cursor: pointer; }
.splist .row.on { background: var(--fill); box-shadow: none; }
.splist .tilei { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; }
.splist .tilei .ic { color: inherit; }
.ed { max-width: 300px; }

/* ---------- Component sheet ---------- */
.win[data-screen="components"] .side { padding-top: 4px; }
.win[data-screen="components"] .side .url { margin-bottom: 6px; }
.sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 36px; align-content: start; padding: 22px 30px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
/* One tile per space color: the chrome it makes, with its accent as the dot. */
.swtile { width: 46px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: linear-gradient(180deg, oklch(0.932 0.014 var(--h)), oklch(0.9 0.02 var(--h))); box-shadow: inset 0 0 0 1px var(--line); }
.swtile::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: oklch(0.58 0.15 var(--ha)); }
.win[data-theme="dark"] .swtile { background: linear-gradient(180deg, oklch(0.255 0.016 var(--h)), oklch(0.215 0.018 var(--h))); }
.win[data-theme="dark"] .swtile::after { background: oklch(0.76 0.13 var(--ha)); }
.grp h3 { margin: 0 0 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.spec { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.chip { font-size: 10.5px; color: var(--ink-2); }
.chip i { display: block; height: 26px; margin-bottom: 4px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--line); }
.scale { display: grid; gap: 3px; color: var(--ink-2); font-size: 11.5px; }
.scale span { display: flex; align-items: baseline; gap: 10px; }
.scale b { width: 150px; font-weight: 400; color: var(--ink); white-space: nowrap; }

const pageInner = (p, mark = (text) => text) => `

const browserWindow = (space, mod) => {
  const view = state.view;
  const drafting = view === 'newspace';
  let found = 0;
  const mark = view === 'find'
    ? (text) => text.replace(new RegExp(`\\b${space.find}\\b`, 'gi'), (word) => `<mark${found++ === 0 ? ' class="cur"' : ''}>${word}</mark>`)
    : undefined;

  let panes;
  if (drafting) {
    panes = `<div class="empty"><span class="badge">${icon(space.icon)}</span><b>${space.name} is empty</b><span>Press ${mod}T to open a tab.</span></div>`;
  } else {
    const inner = pageInner(space.main, mark);
    const findBar = view === 'find'
      ? `<div class="find">${icon('search')}<span class="t">${space.find}<span class="caret"></span></span><small>1 of ${found}</small><button type="button" class="ibtn" aria-label="Previous">${icon('up')}</button><button type="button" class="ibtn" aria-label="Next">${icon('down')}</button><button type="button" class="ibtn" aria-label="Close">${icon('x')}</button></div>`
      : '';
    panes = `<div class="page focus">${inner}${findBar}</div>${view === 'split' ? `<div class="page">${pageInner(space.side)}</div>` : ''}`;
  }

  let today;
  if (view === 'split') {
    const rest = space.today.filter((_, i) => i !== 0 && i !== space.splitWith);
    today = splitRow(space.today[0], space.today[space.splitWith]) + rest.map((tab) => row(tab)).join('');
  } else {
    today = space.today.map((tab, i) => row(tab, { active: i === 0 })).join('');
  }
  // The tab menu opens on the second pinned tab, where it has room to open downward.
  const pinned = view === 'tabmenu'
    ? space.pinned.map((tab, i) => row(tab, { hover: i === 1, extra: i === 1 ? tabMenu(mod) : '' })).join('')
    : undefined;

  const side = view === 'hidden' ? '' : sidebar({
    space, url: space.url, today, pinned, mod, drafting,
    urlPop: view === 'site' ? sitePop(space) : view === 'prompt' ? promptPop(space.url[0]) : '',
    downloadPop: view === 'downloads' ? downloadsPop() : '',
    plusPop: drafting ? newSpacePop() : '',
  });
  return `${side}<div class="panes">${panes}</div>${view === 'command' ? commandBar(space, mod) : ''}`;
};

/* ---------- Board ---------- */
const win = document.getElementById('win');
const controls = document.getElementById('controls');
const segGroup = (key, options) => `<div class="seg" role="group">${options.map(([value, label]) =>
  `<button type="button" data-key="${key}" data-value="${value}" aria-pressed="${state[key] === value}">${label}</button>`).join('')}</div>`;

// The window is drawn 1000 wide and scaled down to fit narrow frames.
const fit = () => {
  const box = win.parentElement;
  const scale = Math.min(1, box.clientWidth / 1000);
  win.style.transform = `scale(${scale})`;
  box.style.height = `${win.offsetHeight * scale}px`;
};

const render = () => {
  const mod = state.os === 'mac' ? '\u2318' : 'Ctrl+';
  const drafting = state.screen === 'window' && state.view === 'newspace';
  const space = drafting ? draft : SPACES[state.space];
  win.dataset.screen = state.screen;
  const tokens = state.screen === 'components' && state.sheet === 'tokens';
  // The token sheet has no sidebar, so it borrows the full-width layout of the hidden-sidebar view.
  win.dataset.view = state.screen === 'window' ? state.view : tokens ? 'hidden' : 'none';
  win.dataset.theme = state.theme;
  win.dataset.os = state.os;
  win.style.setProperty('--h', space.h);
  win.style.setProperty('--ha', space.ha);
  win.innerHTML = tokens ? tokenSheet()
    : state.screen === 'components' ? componentSheet(mod)
    : state.screen === 'settings' ? settingsWindow(space, mod)
    : browserWindow(space, mod);

  const sub = state.screen === 'window' ? segGroup('view', VIEWS) : state.screen === 'settings' ? segGroup('section', SECTIONS) : segGroup('sheet', SHEETS);
  controls.innerHTML = `${segGroup('screen', SCREENS)}${segGroup('space', Object.entries(SPACES).map(([key, sp]) => [key, sp.name]))}${segGroup('theme', THEMES)}${segGroup('os', PLATFORMS)}${sub}`;
  const captionKey = state.screen === 'window' ? state.view : state.screen === 'settings' ? state.section : state.sheet;
  document.getElementById('cap').textContent = CAPTIONS[captionKey] + (state.os === 'win' && state.screen !== 'components' ? WINDOWS_NOTE : '');
  fit();
};

controls.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  state[button.dataset.key] = button.dataset.value;
  render();
});
win.addEventListener('click', (event) => {
  const target = event.target;
  // Switches and segmented controls work in place, so they can be felt.
  const sw = target.closest('.toggle');
  if (sw) return sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
  const segButton = target.closest('.segc button');
  if (segButton) {
    for (const other of segButton.parentElement.children) other.setAttribute('aria-pressed', String(other === segButton));
    return;
  }
  // Icon and color pickers edit the draft space or the current one.
  const pick = target.closest('[data-icon], [data-ha]');
  if (pick) {
    const edited = pick.closest('[data-edit]').dataset.edit === 'draft' ? draft : SPACES[state.space];
    if (pick.dataset.icon) edited.icon = pick.dataset.icon;
    else { edited.h = Number(pick.dataset.h); edited.ha = Number(pick.dataset.ha); }
    return render();
  }
  const section = target.closest('[data-section]');
  if (section) { state.section = section.dataset.section; return render(); }
  const spaceButton = target.closest('[data-space]');
  if (spaceButton) {
    state.space = spaceButton.dataset.space;
    if (state.view === 'newspace') state.view = 'resting';
    render();
  }
});

render();
new ResizeObserver(fit).observe(document.getElementById('root'));
</script>
</body>
</html>
