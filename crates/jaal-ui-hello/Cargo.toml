[package]
name = "jaal-ui-hello"
version = "0.1.0"
description = "The smallest jaal UI library: one window, one tab, through the C API (M1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The engine loads jaal_ui.dll / libjaal_ui.dylib from next to itself.
name = "jaal_ui"
crate-type = ["cdylib"]

[features]
# Reports an ABI the engine doesn't speak, to test that it refuses to start.
wrong-abi = []

[dependencies]
jaal-engine = { path = "../jaal-engine" }
