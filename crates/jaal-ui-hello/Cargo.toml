[package]
name = "jaal-ui-hello"
version = "0.1.0"
description = "The smallest jaal UI library: one window, one tab, through the C API (M1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The acceptance run copies this next to the engine as jaal_ui.dll, the name
# the engine loads. crates/jaal-ui builds the real jaal_ui.
name = "jaal_ui_hello"
crate-type = ["cdylib"]

[features]
# Reports an ABI the engine doesn't speak, to test that it refuses to start.
wrong-abi = []

[dependencies]
jaal-engine = { path = "../jaal-engine" }
