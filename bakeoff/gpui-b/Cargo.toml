[package]
name = "gpui-b"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gpui-b"
path = "src/main.rs"

[[bin]]
name = "gpui-b-helper"
path = "src/bin/gpui-b-helper.rs"

# Read by bundle-cef-app.
[package.metadata.cef.bundle]
helper_name = "gpui-b-helper"

[dependencies]
cef.workspace = true
jaal-bakeoff-shared.workspace = true
jaal-gpui-cef = { path = "../gpui-cef" }
# runtime_shaders: this Mac has no full Xcode, so no offline Metal compiler.
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
futures = "0.3"

# The page path is IOSurfaces and Metal, so gpui-b builds on macOS only. On
# other platforms the binary just says so.
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
# The same versions gpui uses, so a CVPixelBuffer we make is the type
# gpui's surface takes.
core-video = "0.4.3"
core-foundation = "=0.10.0"
io-surface = "0.16"
